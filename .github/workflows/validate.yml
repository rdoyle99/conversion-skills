name: Validate skills

on:
  push:
    branches: [main]
    paths: ["skills/**", "README.md", ".claude-plugin/**", "scripts/**"]
  pull_request:
    paths: ["skills/**", "README.md", ".claude-plugin/**", "scripts/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py
